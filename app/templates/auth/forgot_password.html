{% extends "base.html" %}

{% block title %}Reset Password – TripMate{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card-tm p-4">
        <h4 class="fw-bold mb-2">Forgot Password</h4>
        <p class="text-muted small mb-4">Enter your registered email to receive a password reset token.</p>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Email Address</label>
            <input type="email" name="email" class="form-control" required placeholder="name@tripmate.com">
          </div>
          <button type="submit" class="btn btn-tm-primary w-100 py-2">Send Reset Link</button>
          <div class="text-center mt-3">
            <a href="{{ url_for('auth.login') }}" class="small text-muted"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
