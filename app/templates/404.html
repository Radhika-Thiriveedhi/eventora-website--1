{% extends "base.html" %}

{% block title %}Page Not Found – TripMate{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
  <div class="max-w-600 mx-auto">
    <div class="brand-icon mx-auto mb-3" style="width: 60px; height: 60px; font-size: 2rem;">
      <i class="bi bi-compass"></i>
    </div>
    <h1 class="display-4 fw-bold">404 - Lost Your Way?</h1>
    <p class="text-muted mb-4">
      The travel destination or itinerary page you're searching for might have been relocated or is currently unreachable.
    </p>
    <a href="{{ url_for('public.landing') }}" class="btn btn-tm-primary px-4 py-2">
      <i class="bi bi-house me-1"></i> Return to Homepage
    </a>
  </div>
</div>
{% endblock %}
